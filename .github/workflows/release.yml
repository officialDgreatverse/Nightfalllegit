name: Release APK

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish to public repo
        env:
          GH_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" "Nightfall-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            "Nightfall-${{ github.ref_name }}.apk" \
            --repo officialDgreatverse/REPO_NAME \
            --title "Nightfall ${{ github.ref_name }}" \
            --notes "Nightfall ${{ github.ref_name }}"
