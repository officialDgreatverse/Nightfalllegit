<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightfall – Updates</title>
<style>
  :root{--bg:#0d0d10;--card:#17171c;--text:#eee;--dim:#9a9aa5;--accent:#e23b3b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.5}
  main{max-width:640px;margin:0 auto;padding:24px 16px}
  h1{margin:0 0 4px;letter-spacing:3px}
  .sub{color:var(--dim);margin-bottom:24px}
  .card{background:var(--card);border-radius:12px;padding:18px;margin-bottom:16px}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
       padding:12px 22px;border-radius:8px;font-weight:700;margin-top:10px}
  .notes{white-space:pre-wrap;color:var(--dim);margin-top:8px}
  .old a{color:var(--text)} .old li{margin:6px 0}
  footer{color:var(--dim);font-size:.85rem;text-align:center;margin-top:30px}
  footer a{color:var(--dim)}
</style>
</head>
<body>
<main>
  <h1>NIGHTFALL</h1>
  <div class="sub">Android updates</div>

  <div class="card" id="latest">Checking for the latest version…</div>

  <div class="card old" id="oldCard" hidden>
    <strong>Older versions</strong>
    <ul id="old"></ul>
  </div>

  <footer><a href="privacy.html">Privacy Policy</a></footer>
</main>

<script>
const REPO = "officialDgreatverse/REPO_NAME";

function apkOf(r){
  const a = (r.assets || []).find(x => x.name.endsWith(".apk"));
  return a ? a.browser_download_url : null;
}

async function load(){
  const box = document.getElementById("latest");
  try{
    const res = await fetch(`https://api.github.com/repos/${REPO}/releases`);
    if(!res.ok) throw new Error(res.status);
    const list = (await res.json()).filter(r => !r.draft && !r.prerelease);
    if(!list.length){ box.textContent = "No releases yet."; return; }

    const r = list[0], url = apkOf(r);
    box.innerHTML = "";
    const h = document.createElement("h2");
    h.textContent = "Latest: " + r.tag_name;
    const d = document.createElement("div");
    d.className = "sub";
    d.textContent = new Date(r.published_at).toLocaleDateString();
    const n = document.createElement("div");
    n.className = "notes";
    n.textContent = r.body || "";
    box.append(h, d, n);
    if(url){
      const b = document.createElement("a");
      b.className = "btn"; b.href = url; b.textContent = "Download APK";
      box.append(b);
    }

    const rest = list.slice(1);
    if(rest.length){
      const ul = document.getElementById("old");
      rest.forEach(o => {
        const u = apkOf(o); if(!u) return;
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = u; a.textContent = o.tag_name;
        li.append(a);
        ul.append(li);
      });
      document.getElementById("oldCard").hidden = false;
    }
  }catch(e){
    box.textContent = "Couldn't load updates. Please try again later.";
  }
}
load();
</script>
</body>
</html>
